# Builds llama.cpp's server for CUDA, for the GPUs Colab has (T4, L4, A100,
# H100, and newer ones through PTX), on Colab's Ubuntu, and keeps it in the prerelease
# "llama-cuda", where the llama plugin downloads it from instead of
# building llama.cpp on the runtime for minutes. Weekly, to follow
# llama.cpp, and by hand.
#
# It links CUDA's libraries dynamically: Colab's runtimes have them. Where
# the binary doesn't run, the plugin builds llama.cpp itself.
#
# The plugin checks the archive against the sha256 GitHub's API gives for
# the release's asset, or else against the .sha256 published beside it.
# The build runs with read-only permissions; only the publish job, which
# runs nothing of llama.cpp's, may write the release.
name: llama.cpp for CUDA

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: llama.cpp tag or branch
        default: master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    permissions:
      contents: read
    steps:
      - name: Install the tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git cmake ninja-build ca-certificates curl
      - name: Check out llama.cpp
        env:
          # The input goes through the environment, never into the script.
          REF: ${{ inputs.ref || 'master' }}
        run: |
          set -eu
          # A tag or a branch: letters, digits, . _ - and /, as git allows
          # them, and nothing an option or a revision range could read.
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$' \
            || printf '%s' "$REF" | grep -Eq '\.\.|//|/$|\.lock$|@\{' \
            || ! git check-ref-format --allow-onelevel "$REF"; then
            echo "::error::not a tag or branch name: $REF"
            exit 1
          fi
          git clone --depth 1 --branch "$REF" https://github.com/ggml-org/llama.cpp src
      - name: Build
        run: |
          cmake -S src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="75-real;80-real;86-real;89-real;90-real;90-virtual" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build --target llama-server -j"$(nproc)"
      - name: Pack
        run: |
          mkdir -p out
          cp build/bin/llama-server out/
          (cd src && git rev-parse --short HEAD) > out/VERSION
          tar -czf llama-cuda-linux-x64.tar.gz -C out .
          sha256sum llama-cuda-linux-x64.tar.gz > llama-cuda-linux-x64.tar.gz.sha256
          ls -la llama-cuda-linux-x64.tar.gz
          cat llama-cuda-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: llama-cuda
          path: |
            llama-cuda-linux-x64.tar.gz
            llama-cuda-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: llama-cuda
      - name: Check the checksum
        run: sha256sum -c llama-cuda-linux-x64.tar.gz.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view llama-cuda --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create llama-cuda --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "llama.cpp for CUDA (used by the llama plugin)" \
              --notes "llama-server built for CUDA on Colab's Ubuntu 22.04, which the llama plugin downloads and checks against its sha256. Rebuilt weekly." \
              --target "$GITHUB_SHA"
          fi
          gh release upload llama-cuda llama-cuda-linux-x64.tar.gz llama-cuda-linux-x64.tar.gz.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"
